provider = "github"
provider_display_name = "GitHub"
http_address = "127.0.0.1:4181"
redirect_url = "https://breath-view.example.org/oauth2/callback"
scope = "user:email"
whitelist_domains = ["breath-view.example.org"]
email_domains = ["*"]
# Prefer an explicit operator-managed allowlist. Do not commit real accounts.
github_users = ["replace-with-approved-account"]
upstreams = ["static://202"]
cookie_name = "__Host-breath_view"
cookie_secure = true
cookie_httponly = true
cookie_samesite = "lax"
cookie_expire = "8h"
cookie_refresh = "0s"
reverse_proxy = true
trusted_proxy_ips = ["127.0.0.1/32", "::1/128"]
real_client_ip_header = "X-Real-IP"
skip_provider_button = true
set_xauthrequest = true
pass_access_token = false
pass_authorization_header = false
pass_basic_auth = false
pass_user_headers = false
silence_ping_logging = true
show_debug_on_error = false
request_logging = false
