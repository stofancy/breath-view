# DNS-only Cloudflare record -> Lightsail HTTPS -> Tailscale -> NAS.
# Application capability URL is required; never redirect / to the private URL.
server {
    listen 80;
    listen [::]:80;
    server_name sleep.ztmdsbt.site;
    server_tokens off;
    access_log off;
    error_log /var/log/nginx/breath-view.error.log warn;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 308 https://sleep.ztmdsbt.site$request_uri; }
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sleep.ztmdsbt.site;
    server_tokens off;
    # Request paths contain the user's access key and must not enter access logs.
    access_log off;
    error_log /var/log/nginx/breath-view.error.log crit;
    ssl_certificate /etc/letsencrypt/live/sleep.ztmdsbt.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sleep.ztmdsbt.site/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:BREATH_SSL:1m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    client_max_body_size 8g;
    client_body_timeout 120s;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    location / {
        proxy_pass http://100.120.30.7:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_connect_timeout 15s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        send_timeout 3600s;
    }
}
