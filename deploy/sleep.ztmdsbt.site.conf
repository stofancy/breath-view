# DNS-only Cloudflare record -> Lightsail HTTPS -> Tailscale -> NAS.
# GitHub gate protects all application routes; NAS capability stays server-side.
server {
    listen 80;
    listen [::]:80;
    server_name sleep.ztmdsbt.site;
    server_tokens off;
    access_log off;
    error_log /var/log/nginx/breath-view.error.log warn;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 308 https://sleep.ztmdsbt.site$request_uri; }
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sleep.ztmdsbt.site;
    server_tokens off;
    # Request paths contain the user's access key and must not enter access logs.
    access_log off;
    error_log /var/log/nginx/breath-view.error.log crit;
    ssl_certificate /etc/letsencrypt/live/sleep.ztmdsbt.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sleep.ztmdsbt.site/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:BREATH_SSL:1m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    client_max_body_size 8g;
    client_body_timeout 120s;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    location = /oauth2/auth {
        internal;
        proxy_pass http://127.0.0.1:4181;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Uri $request_uri;
        proxy_set_header Content-Length "";
        proxy_pass_request_body off;
    }
    location /oauth2/ {
        proxy_pass http://127.0.0.1:4181;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Auth-Request-Redirect https://sleep.ztmdsbt.site/;
        proxy_buffering off;
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
    }
    # Runtime-only file contains the NAS capability path and old-link redirect.
    include /etc/nginx/snippets/breath-view-legacy.conf;
    location / {
        auth_request /oauth2/auth;
        error_page 401 = @breath_signin;
        auth_request_set $auth_cookie $upstream_http_set_cookie;
        add_header Set-Cookie $auth_cookie always;
        include /etc/nginx/snippets/breath-view-upstream.conf;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_connect_timeout 15s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        send_timeout 3600s;
    }
    location @breath_signin {
        return 302 /oauth2/start?rd=https://sleep.ztmdsbt.site/;
    }
}
